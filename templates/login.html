{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>

<div x-data="app()">
  <p class="error" x-show="error" x-text="error"></p>

  <form @submit.prevent="login()">
    <input placeholder="username" x-model="loginForm.username" required />
    <input placeholder="password" type="password" x-model="loginForm.password" required />
    <button type="submit">Login</button>
  </form>
</div>
{% endblock %}
